<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garz Manager</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Essential Overlay Styles for the Security Portal */
        .auth-overlay {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%;
            background: #111; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            z-index: 9999;
        }
        .auth-box {
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5); 
            width: 320px; 
            color: #fff; 
            font-family: sans-serif;
        }
        .auth-box h2 { 
            margin-bottom: 20px; 
            color: #a855f7; 
        }
        .auth-box input {
            width: 100%; 
            padding: 10px; 
            margin: 8px 0; 
            border-radius: 6px;
            border: 1px solid #333; 
            background: #2a2a2a; 
            color: #fff; 
            box-sizing: border-box;
        }
        .auth-box button {
            width: 100%; 
            padding: 11px; 
            margin-top: 10px; 
            border-radius: 6px;
            border: none; 
            cursor: pointer; 
            font-weight: bold;
        }
        .btn-primary { 
            background: #a855f7; 
            color: white; 
        }
        .btn-secondary { 
            background: transparent; 
            color: #aaa; 
            border: 1px solid #444 !important; 
        }
    </style>
</head>

<body>

<!-- SECURITY AUTHENTICATION PORTAL OVERLAY -->
<div id="auth-overlay" class="auth-overlay">
    <div class="auth-box">
        <h2 id="auth-title">Garz Manager Login</h2>
        <input type="email" id="auth-email" placeholder="Email Address">
        <input type="password" id="auth-password" placeholder="Password">
        <button class="btn-primary" onclick="handleAuthAction()">Sign In</button>
        <button class="btn-secondary" id="auth-toggle-btn" onclick="toggleAuthMode()">Create an Account</button>
    </div>
</div>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics.js";
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://gstatic.com";
  import { getFirestore, doc, setDoc, getDoc } from "https://gstatic.com";

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyCmT0p-t5aGZKsd2kqi7iP46C1fsEiU6xI",
    authDomain: "garz-dashboard.firebaseapp.com",
    projectId: "garz-dashboard",
    storageBucket: "garz-dashboard.firebasestorage.app",
    messagingSenderId: "832733585201",
    appId: "1:832733585201:web:823543aedb266343699a10",
    measurementId: "G-0J1SMSNXT7"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let isSignUpMode = false;
  let currentUser = null;

  // Toggle between Login and Registration mode
  window.toggleAuthMode = () => {
      isSignUpMode = !isSignUpMode;
      document.getElementById('auth-title').innerText = isSignUpMode ? "Create Garz Account" : "Garz Manager Login";
      document.getElementById('auth-toggle-btn').innerText = isSignUpMode ? "Already have an account? Sign In" : "Create an Account";
  };

  // Run Login or Registration actions
  window.handleAuthAction = async () => {
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;
      
      try {
          if (isSignUpMode) {
              await createUserWithEmailAndPassword(auth, email, password);
              alert("Manager account created successfully!");
          } else {
              await signInWithEmailAndPassword(auth, email, password);
          }
      } catch (error) {
          alert(error.message);
      }
  };

  // Global log-out trigger connected to sidebar click
  window.handleSignOut = () => {
      signOut(auth);
  };

  // Real-time listener guarding dashboard views
  onAuthStateChanged(auth, (user) => {
      const overlay = document.getElementById('auth-overlay');
      const appContent = document.getElementById('main-app-content');
      
      if (user) {
          currentUser = user;
          if (overlay) overlay.style.display = 'none';       // Hide the login screen
          if (appContent) appContent.style.display = 'flex';   // Show your dashboard
          
          // Display email prefix or full email inside sidebar markup profile area
          const emailDisplay = document.getElementById('user-email-display');
          if (emailDisplay) emailDisplay.innerText = user.email.split('@')[0];
          
          loadUserDataPipeline(user.uid);
      } else {
          currentUser = null;
          if (overlay) overlay.style.display = 'flex';       // Bring back the login screen
          if (appContent) appContent.style.display = 'none';   // Block dashboard visibility
      }
  });

  // Isolated database collection pipeline tracking user UID records
  async function loadUserDataPipeline(uid) {
      console.log("Logged in user ID container:", uid);
      // Custom database data load logic runs safely here...
  }
</script>
